<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aidar_Ultimate_Terminal_v5</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff33;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            text-shadow: 0 0 5px #00ff33;
            overflow: hidden; /* Запрещаем прокрутку для спецэффектов */
        }
        .terminal {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 800px;
            margin: 0 auto;
        }
        .log-entry {
            font-size: 16px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .error {
            color: #ff3333;
            text-shadow: 0 0 5px #ff3333;
        }
        .input-line {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .prompt {
            color: #00ff33;
        }
        #cmd-input {
            background: transparent;
            border: none;
            color: #00ff33;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
            text-shadow: 0 0 5px #00ff33;
        }
        /* Стили для экрана Матрицы */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            z-index: 9999;
            background: black;
        }
        /* Стили для агрессивного спама текстом */
        .troll-text {
            position: fixed;
            color: #ff0000;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 8px #ff0000;
            z-index: 10000;
            pointer-events: none;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="terminal" id="terminal-ui">
        <div id="history">
            <div class="log-entry">=== AIDAR OS v5.0 ULTIMATE ===</div>
            <div class="log-entry">Введите 'help' для просмотра списка доступных команд.</div>
            <div class="log-entry">--------------------------------------------------</div>
        </div>
        
        <div class="input-line">
            <span class="prompt">root@aidar_pc:~#</span>
            <input type="text" id="cmd-input" autofocus autocomplete="off">
        </div>
    </div>

    <script>
        const historyDiv = document.getElementById('history');
        const inputField = document.getElementById('cmd-input');
        const terminalUi = document.getElementById('terminal-ui');
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        let matrixInterval = null;
        let trollInterval = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playKeySound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        inputField.addEventListener('keydown', () => playKeySound());

        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const command = inputField.value.trim().toLowerCase();
                addLog(`root@aidar_pc:~# ${inputField.value}`, 'log-entry');
                
                if (command === 'help') {
                    addLog('Доступные команды:\n  help    - показать это меню\n  scan    - запустить сканирование сети\n  hack    - симуляция взлома протокола\n  matrix  - запустить режим Матрицы\n  hacking - запустить протокол X\n  clear   - очистить экран', 'log-entry');
                } else if (command === 'scan') {
                    addLog('Запуск сканирования портов...\n[OK] Port 80 found\n[OK] Port 443 found\nСканирование завершено.', 'log-entry');
                } else if (command === 'hack') {
                    addLog('ВНИМАНИЕ: Попытка обхода брандмауэра...\n..........................\n[УСПЕШНО] КЛЮЧИ ПОЛУЧЕНЫ. СИСТЕМА ПОД КОНТРОЛЕМ.', 'error');
                } else if (command === 'clear') {
                    historyDiv.innerHTML = '';
                } else if (command === 'matrix') {
                    startMatrixMode();
                } else if (command === 'hacking') {
                    startTrollMode();
                } else if (command !== '') {
                    addLog(`Ошибка: команда '${command}' не найдена.`, 'error');
                }
                
                inputField.value = '';
                window.scrollTo(0, document.body.scrollHeight);
            }
        });

        function addLog(text, className) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            historyDiv.appendChild(div);
        }

        document.addEventListener('click', () => {
            if (canvas.style.display !== 'block') inputField.focus();
        });

        // РЕЖИМ МАТРИЦЫ
        function startMatrixMode() {
            terminalUi.style.display = 'none';
            canvas.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const katakana = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890";
            const alphabet = katakana.split("");
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const rainDrops = [];
            for (let x = 0; x < columns; x++) rainDrops[x] = 1;

            const draw = () => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0F0';
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < rainDrops.length; i++) {
                    const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                    ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                    if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                    rainDrops[i]++;
                }
            };
            matrixInterval = setInterval(draw, 30);
        }

        function stopMatrixMode() {
            if (matrixInterval) {
                clearInterval(matrixInterval);
                canvas.style.display = 'none';
                terminalUi.style.display = 'flex';
                inputField.focus();
            }
        }

        // СЕКРЕТНЫЙ РЕЖИМ СПАМА ТЕКСТОМ
        function startTrollMode() {
            // Сначала делаем экран полностью черным, скрывая интерфейс
            terminalUi.style.display = 'none';
            document.body.style.backgroundColor = '#000000';

            // Через 1 секунду (1000 миллисекунд) запускаем лавину текста
            setTimeout(() => {
                trollInterval = setInterval(() => {
                    const div = document.createElement('div');
                    div.className = 'troll-text';
                    div.textContent = 'ЛОХ ЕБАНЫЙ';
                    
                    // Случайные координаты по всему экрану
                    const randomX = Math.floor(Math.random() * (window.innerWidth - 150));
                    const randomY = Math.floor(Math.random() * (window.innerHeight - 30));
                    
                    div.style.left = randomX + 'px';
                    div.style.top = randomY + 'px';
                    
                    // Случайный размер шрифта для большего хаоса (от 18px до 36px)
                    div.style.fontSize = Math.floor(Math.random() * 18 + 18) + 'px';
                    
                    document.body.appendChild(div);
                }, 40); // Скорость появления: каждые 40 миллисекунд
            }, 1000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                stopMatrixMode();
                // Для сброса спам-режима проще всего обновить страницу
                if(trollInterval) window.location.reload();
            }
        });
        
        canvas.addEventListener('click', () => stopMatrixMode());

        window.addEventListener('resize', () => {
            if (canvas.style.display === 'block') {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>

</body>
</html>
